services:
  php:
    build: ./docker/php
    command: sh -c "composer install && php bin/console lexik:jwt:generate-keypair --skip-if-exists && php bin/console doctrine:migrations:migrate --no-interaction && chmod -R 777 var && chmod -R a+rX config/jwt && php-fpm"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  apache:
    build: ./docker/apache
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/apache/vhost.conf:/usr/local/apache2/conf/extra/vhost.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pixcube_api
      MYSQL_USER: pixcube_api
      MYSQL_PASSWORD: pixcube_api
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql

  maildev:
    image: maildev/maildev
    ports:
      - "127.0.0.1:1080:1080"

volumes:
  mysql_data: